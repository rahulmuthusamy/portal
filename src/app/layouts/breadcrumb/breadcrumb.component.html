<!-- Breadcrumb — Tailwind CSS -->
<nav *ngIf="breadcrumbs | async as crumbs"
     class="flex items-center gap-1.5 px-6 py-2.5 bg-white border-b border-slate-100 text-sm overflow-x-auto">

  <!-- Home -->
  <a routerLink="/kkk" class="flex items-center gap-1 text-slate-500 hover:text-sky-600 transition-colors no-underline flex-shrink-0">
    <mat-icon class="!text-base !w-4 !h-4">home</mat-icon>
    <span class="font-medium">Home</span>
  </a>

  <ng-container *ngFor="let crumb of crumbs; let last = last">
    <!-- Separator -->
    <mat-icon class="!text-sm !w-3.5 !h-3.5 text-slate-300 flex-shrink-0">chevron_right</mat-icon>

    <ng-container *ngIf="!last">
      <a [routerLink]="crumb.url" class="text-slate-500 hover:text-sky-600 transition-colors no-underline font-medium truncate">
        {{ crumb.label }}
      </a>
    </ng-container>
    <ng-container *ngIf="last">
      <span class="text-slate-800 font-semibold truncate">{{ crumb.label }}</span>
    </ng-container>
  </ng-container>

</nav>
