<!-- =====================================================
     LOGIN PAGE — CricHub Admin Portal (Tailwind CSS)
     ===================================================== -->
<div class="min-h-screen flex items-center justify-center relative overflow-hidden p-5"
     style="background: linear-gradient(135deg, #0c4a6e 0%, #0f172a 55%, #1e1b4b 100%);">

  <!-- Decorative blobs -->
  <div class="absolute top-[15%] right-[10%] w-64 h-64 rounded-full opacity-10 blur-3xl"
       style="background: radial-gradient(circle, #38bdf8, transparent); animation: float 20s infinite ease-in-out;"></div>
  <div class="absolute bottom-[10%] left-[5%] w-48 h-48 rounded-full opacity-10 blur-3xl"
       style="background: radial-gradient(circle, #f59e0b, transparent); animation: float 25s infinite ease-in-out reverse;"></div>

  <!-- Grid pattern overlay -->
  <div class="absolute inset-0 opacity-[0.03]"
       style="background-image: linear-gradient(rgba(255,255,255,0.1) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.1) 1px, transparent 1px); background-size: 50px 50px;"></div>

  <!-- Login Card -->
  <div class="relative w-full max-w-md animate-slide-up">
    <!-- Card shell -->
    <div class="bg-white/[0.05] backdrop-blur-2xl border border-white/10 rounded-3xl shadow-2xl overflow-hidden">

      <!-- Top accent line -->
      <div class="h-1 bg-gradient-to-r from-sky-400 via-sky-500 to-indigo-500"></div>

      <!-- Brand block -->
      <div class="flex flex-col items-center pt-10 pb-6 px-8">
        <!-- Logo circle -->
        <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-sky-400 to-sky-600 flex items-center justify-center mb-5 shadow-lg shadow-sky-500/30 overflow-hidden">
          <ng-container *ngIf="appSettings.logoUrl; else defaultLogo">
            <img [src]="appSettings.logoUrl" alt="Logo" class="w-full h-full object-cover">
          </ng-container>
          <ng-template #defaultLogo>
            <svg class="w-8 h-8 text-white" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/>
            </svg>
          </ng-template>
        </div>

        <h1 class="text-white text-3xl font-extrabold tracking-tight mb-1">{{ appSettings.appName }}</h1>
        <p class="text-slate-400 text-sm font-medium">Manage teams, auctions & tournaments</p>
      </div>

      <!-- Form -->
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="px-8 pb-8 flex flex-col gap-5">

        <!-- Email/Phone field -->
        <div class="flex flex-col gap-1.5">
          <label class="text-[11px] font-bold uppercase tracking-widest text-slate-400">Email or Phone</label>
          <mat-form-field appearance="outline" class="w-full login-field">
            <input matInput type="text" formControlName="username"
                   placeholder="Enter your email or phone" autocomplete="username"/>
            <mat-icon matSuffix class="text-slate-500">person_outline</mat-icon>
          </mat-form-field>
        </div>

        <!-- Password field -->
        <div class="flex flex-col gap-1.5">
          <label class="text-[11px] font-bold uppercase tracking-widest text-slate-400">Password</label>
          <mat-form-field appearance="outline" class="w-full login-field">
            <input matInput formControlName="password"
                   [type]="hidePassword ? 'password' : 'text'"
                   placeholder="Enter your password" autocomplete="current-password"/>
            <mat-icon matSuffix (click)="hidePassword = !hidePassword"
                      class="text-slate-500 cursor-pointer hover:text-sky-400 transition-colors">
              {{ hidePassword ? 'visibility_off' : 'visibility' }}
            </mat-icon>
          </mat-form-field>
        </div>

        <!-- Error banner -->
        <div *ngIf="errorMessage"
             class="flex items-center gap-2.5 px-4 py-3 bg-red-500/10 border border-red-500/30 rounded-xl text-red-400 text-sm font-medium">
          <mat-icon class="text-base flex-shrink-0">error_outline</mat-icon>
          <span>{{ errorMessage }}</span>
        </div>

        <!-- Submit button -->
        <button type="submit" [disabled]="loading"
                class="w-full h-12 mt-1 rounded-xl font-bold text-white text-sm tracking-wide
                       bg-gradient-to-r from-sky-500 to-sky-600
                       hover:from-sky-400 hover:to-sky-500
                       shadow-lg shadow-sky-500/30
                       disabled:opacity-60 disabled:cursor-not-allowed
                       transition-all duration-200 hover:-translate-y-0.5 hover:shadow-xl hover:shadow-sky-500/40
                       active:scale-95 active:shadow-md">
          <span *ngIf="!loading">Sign In →</span>
          <span *ngIf="loading" class="flex items-center justify-center gap-2">
            <mat-spinner diameter="18"></mat-spinner>
            Signing in…
          </span>
        </button>

      </form>

      <!-- Footer -->
      <div class="text-center pb-6 text-slate-500 text-xs">
        <span class="hover:text-sky-400 cursor-pointer transition-colors">Need help? Contact support</span>
      </div>
    </div>

    <!-- Sub-text -->
    <p class="text-center text-slate-600 text-xs mt-4">
      Secured by Ravens Analytics
    </p>
  </div>

</div>
