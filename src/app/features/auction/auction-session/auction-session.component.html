<div class="auction-session-wrapper">
  <div class="session-table-container">
    <div class="header-bar">
      <h1 class="page-title">Auction Sessions</h1>
      <button class="neon-btn primary" (click)="addSession()">
        <span>+ Add Session</span>
      </button>
    </div>
    <app-data-table [config]="tableConfig" [data]="auctionSession$ | async" (actionClick)="handleAction($event)">
    </app-data-table>
  </div>
</div>
